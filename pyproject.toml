[project]
name = "coursework-ml-microservices"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "ruff>=0.15.12",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.uv.workspace]
members = [
    "frontend",
    "gateway",
    "shared",
    "ml_worker",
    "orchestrator",
    "auth",
]


[tool.pyright]
# BasedPyright / Pyright configuration for this monorepo.
# Keep settings.py conservative so developers don't get noisy errors by default.
pythonVersion = "3.13"
typeCheckingMode = "basic" # 'off'| 'basic' | 'strict' - 'basic' is a good middle ground

# Include the package source folders in the workspace so pyright resolves imports
include = [
    "frontend",
    "gateway",
    "shared",
    "ml_worker",
    "orchestrator",
    "auth",
]

# Common excludes (build artifacts, migrations, venvs)
exclude = [
    "**/__pycache__/**",
    "**/migrations/**",
    "**/.venv/**",
    "**/venv/**",
]

# Limit some error reports that are noisy in mixed repo setups
reportMissingImports = false
reportMissingTypeStubs = false
