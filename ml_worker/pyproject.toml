[project]
name = "ml_worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.3.6",
    "langgraph>=1.2.11",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.11.0",
    "shared",
]


[tool.uv]
managed = true
package = true

[tool.uv.sources]
shared = { workspace = true }

[tool.setuptools]
packages = ["ml_worker"]
package-dir = { "ml_worker" = "." }


[tool.pyright]
# Per-package pyright settings.py to keep IDEs and basedpyright happy.
pythonVersion = "3.13"
typeCheckingMode = "basic"

# Analyze the package source in this folder
include = ["."]

exclude = [
    "**/__pycache__/**",
    "**/migrations/**",
    "**/.venv/**",
    "**/venv/**",
]

reportMissingImports = false
reportMissingTypeStubs = false
