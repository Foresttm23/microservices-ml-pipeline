[project]
name = "gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi-limiter==0.1.6",
    "fastapi[standard]>=0.136.1",
    "PyJWT>=2.8.0",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.setuptools]
packages = ["gateway"]
package-dir = { "gateway" = "." }


[tool.pyright]
# Per-package pyright settings.py to keep IDEs and basedpyright happy.
pythonVersion = "3.13"
typeCheckingMode = "basic"

# Analyze the package source in this folder
include = ["."]

exclude = [
    "**/__pycache__/**",
    "**/migrations/**",
    "**/.venv/**",
    "**/venv/**",
]

reportMissingImports = false
reportMissingTypeStubs = false
