services:
  gateway:
    env_file:
      - .env
      - gateway/.env
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8000"  # Host 8080 -> Container 8000

  orchestrator:
    env_file:
      - .env
      - orchestrator/.env
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8081:8000"  # Host 8081 -> Container 8000

  ml_worker:
    env_file:
      - .env
      - ml_worker/.env
    build:
      context: .
      dockerfile: ml_worker/Dockerfile
    environment:
      - PORT=8000    # We force it to 8000 inside Docker
    ports:
      - "8082:8000"  # Host 8082 -> Container 8000