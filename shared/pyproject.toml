[project]
name = "shared"
version = "0.1.0"
description = "Shared cross-service contracts and utilities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.13.3",
    "redis>=5.0.1",
]

[tool.uv]
managed = true
package = true


[tool.setuptools.packages.find]
include = ["shared*"]


[tool.pyright]
# Per-package pyright settings.py to keep IDEs and basedpyright happy.
pythonVersion = "3.13"
typeCheckingMode = "basic"

# Analyze the package source in this folder
include = ["."]

exclude = [
    "**/__pycache__/**",
    "**/migrations/**",
    "**/.venv/**",
    "**/venv/**",
]

reportMissingImports = false
reportMissingTypeStubs = false


